[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mukhtabar"
version = "0.0.1"
description = "A study buddy that quizzes you on your own material and drills your weakest topics."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pdfplumber",
    "litellm>=1.106.2,<2",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
# The other extractors, only for re-running the milestone 0 comparison.
spike = [
    "pypdf",
    "pypdfium2",
    "pymupdf",
]
# pypdf: checks the fixtures still fool a naive extractor; fpdf2: regenerates them.
dev = ["pytest", "pypdf", "fpdf2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
mukhtabar = ["prompts/*.txt"]

[tool.setuptools.packages.find]
include = ["mukhtabar*"]
